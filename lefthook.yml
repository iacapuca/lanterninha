# Git hooks (installed by `pnpm install` via the prepare script).
# pre-commit stays fast: format and lint only the staged files.
# pre-push runs the whole-project checks.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,mjs,json,jsonc,md,css,yml,yaml}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx,js,mjs}'
      run: pnpm exec oxlint {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
